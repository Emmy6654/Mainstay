name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      # Cache strategy: key on the Cargo.lock hash, so caches are reused across runs
      # until dependencies change. This avoids re-downloading crates and re-building
      # the `target/` directory on every CI run.
      #
      # Caches cached paths:
      # - ~/.cargo/registry
      # - ~/.cargo/git
      # - target/
      - name: Cargo cache (lockfile keyed)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run workspace tests
        run: cargo test --workspace

  wasm-size:
    name: WASM Size Check
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build WASM contracts
        run: cargo build --target wasm32-unknown-unknown --release

      - name: Check WASM sizes
        run: |
          # Soroban maximum WASM size is 65536 bytes
          # Threshold set at 80% (52428 bytes) to leave headroom
          MAX_SIZE=52428
          THRESHOLD_PCT=80

          echo "Checking WASM binary sizes against ${THRESHOLD_PCT}% of Soroban max (${MAX_SIZE} bytes)..."

          EXCEEDED=0
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            SIZE=$(stat -c%s "$wasm" 2>/dev/null || stat -f%z "$wasm" 2>/dev/null)
            NAME=$(basename "$wasm")
            echo "  ${NAME}: ${SIZE} bytes"
            if [ "$SIZE" -gt "$MAX_SIZE" ]; then
              echo "::error file=${wasm}::${NAME} is ${SIZE} bytes, exceeding the ${MAX_SIZE} byte threshold"
              EXCEEDED=1
            fi
          done

          if [ "$EXCEEDED" -eq 1 ]; then
            echo "::error::One or more WASM binaries exceed the size threshold"
            exit 1
          fi
          echo "All WASM binaries are within the size limit."

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
